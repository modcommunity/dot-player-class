[plugin]

name="dot-player-class"
description="What a player IS, as a bounded document a dedicated server can check without loading any content: health, armour, movement multipliers, ability and loadout ids, per-team limits and entitlements. A change is recorded and lands on the next spawn, not mid-fight. Depends on dot-core and dot-player."
author="dot"
version="0.1.0"
script="dot_player_class_plugin.gd"
